<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orb Rush</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- Input (mouse, touch, keyboard) ----
let mx = W/2, my = H/2;
function move(e){ const t = e.touches ? e.touches[0] : e; mx = t.clientX; my = t.clientY; }
addEventListener('mousemove', move);
addEventListener('touchmove', e => { e.preventDefault(); move(e); }, {passive:false});
addEventListener('touchstart', e => { e.preventDefault(); move(e); press(); }, {passive:false});
addEventListener('mousedown', press);
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyS' && state !== 'play') state = 'shop';
  else if (e.code === 'KeyC' && state === 'over'){
    try { navigator.clipboard.writeText('I scored ' + Math.floor(score) + ' in Orb Rush! Beat me: ' + location.href); pop(W/2, H/2 - 120, 'COPIED!', '#fff'); } catch(err) {}
  }
  else if (e.code === 'Space' || e.key === 'Enter'){ if (state === 'shop') start(); else press(); }
});

// ---- Game state ----
let state = 'menu', overAt = 0, last = 0, runs = 0, slow = 0, beat = false;
let streak = 0, dailyBonus = 0, beatT = 0, dashT = 0, dashCd = 0, goldRush = false, frozen = 0, shownScore = 0, nextMile = 500, ach = [], dblT = 0, chain = 0, bigMag = false, perfect = 0, lasers = [], lsT = 12, musT = 0, nmT = 0, nmC = 0, lucky = 1;
let coins = 0, coinsGot = 0, lives = 0, inv = 0, skinSel = 0, own = [0], up = {dash:0, mag:0, score:0, shield:0, life:0, ctime:0};
let wave = 0, smashN = 0, smashTot = 0, goldT = 0, magT = 0, topRuns = [], rankPos = 0;
let xp = 0, goalIdx = 0, goalDone = false, jps = 0, nears = 0, pulses = 0, maxCombo = 1;
let xpBonus = 0, gained = 0, leveled = false, shield = false, evT = 20, swarm = 0, banner = '', bannerT = 0;
let p, orbs, haz, parts, rings, warns = [];
let score, combo, comboT, t, spawnO, spawnH, collected, shake, best = 0;
try { best = +localStorage.getItem('orbrush-best') || 0; runs = +localStorage.getItem('orbrush-runs') || 0;
  xp = +localStorage.getItem('orbrush-xp') || 0; goalIdx = +localStorage.getItem('orbrush-goal') || 0;
  const today = new Date().toDateString(), lastDay = localStorage.getItem('orbrush-day');
  streak = +localStorage.getItem('orbrush-streak') || 0;
  ach = (localStorage.getItem('orbrush-ach') || '').split(',').filter(Boolean).map(Number);
  const sv = JSON.parse(localStorage.getItem('orbrush-shop') || 'null');
  if (sv){ coins = sv.coins || 0; up = Object.assign(up, sv.up); own = sv.own || [0]; skinSel = sv.skinSel || 0; }
  topRuns = JSON.parse(localStorage.getItem('orbrush-topRuns') || '[]');
  if (lastDay !== today){   // first visit today: grow the streak and earn a bonus
    const yest = new Date(Date.now() - 864e5).toDateString();
    streak = lastDay === yest ? streak + 1 : 1;
    dailyBonus = 100 * Math.min(streak, 7);
    localStorage.setItem('orbrush-day', today); localStorage.setItem('orbrush-streak', streak);
  } } catch(e) {}

const rand = (a,b) => a + Math.random()*(b-a);

// ---- Goals, levels and unlockable colors ----
const goals = [
  {txt:'Score 300',          ok:() => score >= 300},
  {txt:'Collect 15 orbs',    ok:() => collected >= 15},
  {txt:'Hit FEVER (x10)',    ok:() => maxCombo >= 10},
  {txt:'Grab 2 jackpots',    ok:() => jps >= 2},
  {txt:'Survive 60 seconds', ok:() => t >= 60},
  {txt:'Trigger 2 pulses',   ok:() => pulses >= 2},
  {txt:'5 near misses',      ok:() => nears >= 5},
  {txt:'Score 1500',         ok:() => score >= 1500},
  {txt:'Reach wave 4',    ok:() => wave >= 4},
  {txt:'Smash 5 enemies', ok:() => smashTot >= 5},
  {txt:'Collect 50 orbs', ok:() => collected >= 50},
  {txt:'Score 4000',      ok:() => score >= 4000}
];
const achs = [
  {n:'Jackpot!',        ok:() => jps >= 1},
  {n:'Fever Master',    ok:() => maxCombo >= 10},
  {n:'Survivor (90s)',  ok:() => t >= 90},
  {n:'Pulse King',      ok:() => pulses >= 3},
  {n:'Daredevil',       ok:() => nears >= 10},
  {n:'Wave 5',       ok:() => wave >= 5},
  {n:'Collector',    ok:() => collected >= 40},
  {n:'Triple Jackpot', ok:() => jps >= 3},
  {n:'Perfect 10',   ok:() => perfect >= 10}
];
const stars = Array.from({length: 50}, () => ({x: Math.random()*2000, y: Math.random()*1200, s: Math.random()*2 + .5}));
const ranks = ['Rookie', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Master', 'Legend'];
const petPos = () => ({x: p.x + Math.cos(t*3)*34, y: p.y + Math.sin(t*3)*34});   // orbiting pet (unlocks at level 3)
const rank = () => ranks[Math.min(ranks.length - 1, level(xp) - 1)];
const skins = ['#6cf', '#a29bfe', '#55efc4', '#ffeaa7', '#fff', '#b8e994', '#e0aaff', '#ffd166'];

// ---- Shop: spend coins on upgrades and colors ----
const upDefs = [
  {k:'dash',   n:'Faster Dash',  d:'shorter dash cooldown',     max:5, cost:l => 100*(l + 1)},
  {k:'mag',    n:'Orb Magnet',   d:'pulls orbs from farther',   max:5, cost:l => 80*(l + 1)},
  {k:'score',  n:'Orb Value',    d:'+10% points per level',     max:5, cost:l => 150*(l + 1)},
  {k:'ctime',  n:'Combo Time',   d:'combo lasts longer',        max:5, cost:l => 120*(l + 1)},
  {k:'life',   n:'Extra Life',   d:'survive one hit per level', max:2, cost:l => 500*(l + 1)},
  {k:'shield', n:'Start Shield', d:'begin each run shielded',   max:1, cost:l => 400}
];
const skinCost = [0, 100, 150, 200, 250, 300, 400, 500];
const myColor = () => skins[skinSel] || skins[0];
const dashMax = () => Math.max(1.5, 4 - up.dash*.5);
const cTime = () => Math.max(1, 2.2 - combo*.12) + up.ctime*.3;   // higher combo = shorter timer
function save(){ try { localStorage.setItem('orbrush-shop', JSON.stringify({coins, up, own, skinSel})); } catch(e) {} }
const btn = () => ({x: W/2 - 90, y: state === 'menu' ? H/2 + 150 : H/2 + 235, w: 180, h: 40});
function drawBtn(){
  const b = btn();
  x.fillStyle = '#161628'; x.fillRect(b.x, b.y, b.w, b.h);
  x.strokeStyle = '#6cf'; x.lineWidth = 2; x.strokeRect(b.x, b.y, b.w, b.h);
  text('SHOP + COLORS', W/2, b.y + 26, 16, '#6cf');
}
function shopLayout(){ const w = Math.min(460, W - 20); return {w, x0: W/2 - w/2, y0: Math.max(10, H/2 - 215)}; }
function shopTap(){
  const {w, x0, y0} = shopLayout(), n = upDefs.length;
  upDefs.forEach((u, i) => {
    const ry = y0 + 50 + i*42;
    if (mx > x0 && mx < x0 + w && my > ry && my < ry + 38){
      const lv = up[u.k], c = u.cost(lv);
      if (lv < u.max && coins >= c){ coins -= c; up[u.k]++; save(); beep(880, .15, 'triangle'); }
      else beep(150, .15, 'square');
    }
  });
  skins.forEach((sk, i) => {
    const cx = x0 + 20 + i*(w - 40)/(skins.length - 1), cy = y0 + 50 + n*42 + 30;
    if (Math.hypot(mx - cx, my - cy) < 20){
      if (own.includes(i)) skinSel = i;
      else if (coins >= skinCost[i]){ coins -= skinCost[i]; own.push(i); skinSel = i; }
      else { beep(150, .15, 'square'); return; }
      save(); beep(660, .12, 'triangle');
    }
  });
  const by = y0 + 50 + n*42 + 62;
  if (mx > x0 && mx < x0 + w && my > by && my < by + 46) start();
}
function drawShop(){
  const {w, x0, y0} = shopLayout(), n = upDefs.length;
  text('SHOP', W/2, y0 + 22, 28, '#6cf');
  text(coins + ' coins', W/2, y0 + 42, 16, '#ffd34d');
  upDefs.forEach((u, i) => {
    const ry = y0 + 50 + i*42, lv = up[u.k], c = u.cost(lv), maxed = lv >= u.max;
    x.fillStyle = '#161628'; x.fillRect(x0, ry, w, 38);
    text(u.n + '  Lv ' + lv + '/' + u.max, x0 + 10, ry + 16, 15, '#fff', 'left');
    text(u.d, x0 + 10, ry + 31, 11, '#889', 'left');
    text(maxed ? 'MAX' : c + ' coins', x0 + w - 10, ry + 24, 14, maxed ? '#55efc4' : coins >= c ? '#ffd34d' : '#667', 'right');
  });
  text('COLORS: tap to pick or buy', W/2, y0 + 50 + n*42 + 8, 12, '#889');
  skins.forEach((sk, i) => {
    const cx = x0 + 20 + i*(w - 40)/(skins.length - 1), cy = y0 + 50 + n*42 + 30;
    x.globalAlpha = own.includes(i) ? 1 : .4;
    glowCircle(cx, cy, 12, sk);
    x.globalAlpha = 1;
    if (i === skinSel){ x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, 18, 0, 6.283); x.stroke(); }
    if (!own.includes(i)) text(skinCost[i], cx, cy + 30, 10, '#ffd34d');
  });
  const by = y0 + 50 + n*42 + 62;
  x.fillStyle = '#6cf'; x.fillRect(x0, by, w, 46);
  text('PLAY', W/2, by + 31, 24, '#07070f');
}
const level = v => Math.floor(Math.sqrt(v/150)) + 1;
function xpBar(y){
  const l = level(xp), a = 150*(l-1)*(l-1), b = 150*l*l;
  x.fillStyle = '#223'; x.fillRect(W/2 - 100, y, 200, 8);
  x.fillStyle = '#55efc4'; x.fillRect(W/2 - 100, y, 200*(xp - a)/(b - a), 8);
}

// ---- Sound beeps and floating score text ----
let ac, pops = [];
function beep(f, d, type, vol){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.value = vol || .08; g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch(e) {}
}
function pop(px, py, s, col){ pops.push({x:px, y:py, s, col, life:1}); }

// a beep that slides from one pitch to another (used to build big sounds)
function sweep(f1, f2, d, type, vol){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + d);
    g.gain.setValueAtTime(vol || .12, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d);
  } catch(e) {}
}
// deep boom + rising whoosh + sparkly notes = satisfying blast
// Shepard tone: stacked octaves that fade in and out, so the pitch seems to climb forever
function shepard(n){
  const base = (n % 12) / 12;
  for (let i = 0; i < 6; i++){
    const pos = (i + base) / 6;
    const w = Math.exp(-Math.pow((pos - .5) / .2, 2));   // loudest in the middle of the stack
    beep(55 * Math.pow(2, i + base), .15, 'sine', .09 * w);
  }
}
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e) {} }   // phone vibration
function pulseSfx(){
  buzz([60, 40, 60]);
  sweep(180, 30, .6, 'sine', .3);
  sweep(200, 1400, .3, 'sawtooth', .08);
  [784, 988, 1175, 1568, 1976].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle'), 120 + i*60));
}

function press(){
  if (state === 'play'){ dash(); return; }
  if (state === 'over' && performance.now() - overAt < 600) return;
  if (state === 'shop'){ shopTap(); return; }
  const b = btn();
  if (mx > b.x && mx < b.x + b.w && my > b.y && my < b.y + b.h){ state = 'shop'; return; }
  start();
}

// DASH: a quick burst that smashes any enemy you touch (2.5 second cooldown)
function dash(){
  if (dashCd > 0) return;
  dashT = .3; dashCd = dashMax(); smashN = 0; shake = 6;
  sweep(300, 900, .2, 'square', .1); buzz(30);
}

function start(){
  pops = []; warns = []; beat = false;
  goalDone = false; jps = 0; nears = 0; pulses = 0; maxCombo = 1; xpBonus = 0; leveled = false;
  shield = up.shield > 0; lives = up.life; inv = 0; evT = 35; swarm = 0; bannerT = 0; dashT = 0; dashCd = 0;
  frozen = 0; dblT = 0; shownScore = 0; nextMile = 500;
  goldRush = false; goldT = 0; magT = 0; wave = 0; smashN = 0; smashTot = 0;
  
  chain = 0;
  perfect = 0; lasers = []; lsT = 35;
  bigMag = false;
  
  p = {x:mx, y:my, r:12};
  orbs = []; haz = []; parts = []; rings = [];
  score = 0; combo = 1; comboT = 0; t = 0; spawnO = 0; spawnH = 1; collected = 0; shake = 0;
  state = 'play';
}

function burst(px, py, col, n){
  for (let i = 0; i < n; i++){
    const a = rand(0, 6.283), s = rand(60, 300);
    parts.push({x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(.4,.9), col});
  }
}

function die(){
  if (inv > 0) return false;
  if (lives > 0){   // Extra Life upgrade: survive the hit
    lives--; inv = 1.5; haz = []; warns = []; lasers = []; shield = false;
    burst(p.x, p.y, '#fff', 40); pop(p.x, p.y - 40, 'EXTRA LIFE USED!', '#fff'); shake = 20; slow = .5; buzz(150);
    return false;
  }
  state = 'over'; overAt = performance.now(); shake = 22;
  beep(90, .5, 'sawtooth'); buzz(250);
  runs++;
  try { localStorage.setItem('orbrush-runs', runs); } catch(e) {}
  const before = level(xp);
  const roll = Math.random(); lucky = roll < .1 ? 3 : roll < .35 ? 2 : 1;   // random bonus: 10% x3, 25% x2
  gained = (Math.floor(score/5) + xpBonus + dailyBonus) * lucky; dailyBonus = 0; xp += gained;
  leveled = level(xp) > before;
  if (leveled) [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .3, 'triangle'), 400 + i*120));
  try { localStorage.setItem('orbrush-xp', xp); } catch(e) {}
  coinsGot = (Math.floor(score/25) + Math.floor(collected/2) + maxCombo*3) * lucky + (leveled ? 100 : 0);
  coins += coinsGot; save();
  topRuns.push(Math.floor(score)); topRuns.sort((a, b) => b - a); topRuns = topRuns.slice(0, 5);
  rankPos = topRuns.indexOf(Math.floor(score)) + 1;   // 0 means not in the topRuns 5
  try { localStorage.setItem('orbrush-topRuns', JSON.stringify(topRuns)); } catch(e) {}
  return true;
  burst(p.x, p.y, myColor(), 100);
  if (score > best){
    best = Math.floor(score);
    try { localStorage.setItem('orbrush-best', best); } catch(e) {}
  }
}

// ---- Update ----
function update(dt){
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .98; q.vy *= .98; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const r of rings){ r.r += 900*dt; r.a -= dt*1.6; }
  rings = rings.filter(r => r.a > 0);
  for (const f of pops) f.life -= dt*1.2;
  pops = pops.filter(f => f.life > 0);
  shake *= .9;
  if (state === 'over' && shownScore < score) shownScore = Math.min(score, shownScore + Math.max(5, score*dt*1.2));
  if (state !== 'play') return;

  t += dt;
  score += dt * 3 * combo;   // surviving earns points
  dashT -= dt; dashCd -= dt; nmT -= dt; inv -= dt;
  const k = Math.min(1, dt * (dashT > 0 ? 40 : 14));   // dashing = much faster follow
  p.x += (mx - p.x) * k;
  p.y += (my - p.y) * k;
  parts.push({x:p.x, y:p.y, vx:0, vy:0, life:.3, col:myColor()});   // comet trail

  // spawn orbs
  spawnO -= dt;
  if (spawnO <= 0 && orbs.length < (combo === 10 ? 6 : 4)){
    spawnO = combo === 10 ? .5 : 1.1;   // fever frenzy: orbs rain faster
    const jp = Math.random() < (combo === 10 ? .3 : .12) || (collected > 0 && collected % 15 === 14 && !orbs.some(q => q.jp));   // rare pink jackpot orb
    const sh = !jp && !shield && Math.random() < .1;   // rare cyan shield orb
    const hz = haz.length && Math.random() < .25 ? haz[Math.floor(rand(0, haz.length))] : null;   // risk orb: sits next to an enemy
    orbs.push({x: hz ? Math.min(W-30, Math.max(30, hz.x + rand(-70, 70))) : rand(40, W-40),
               y: hz ? Math.min(H-30, Math.max(60, hz.y + rand(-70, 70))) : rand(70, H-40),
               r:jp ? 15 : 10, life:jp ? 2.2 : 3, jp, sh, risk: !!hz, born: t,
               fr: !jp && !sh && Math.random() < .08, dp: !jp && !sh && Math.random() < .06, dc: !jp && !sh && Math.random() < .07, gm: !jp && !sh && Math.random() < .06});
  }

  // spawn hazards (faster and faster)
  spawnH -= dt;
  if (spawnH <= 0){
    spawnH = (swarm > 0 ? .5 : 1) * Math.max(.2, 1.0 / (1 + t/45)) / (combo >= 6 ? 1.25 : 1);   // better players face more enemies
    const e = Math.floor(rand(0,4)), sp = (110 + 190 * (1 - Math.exp(-t/60))) * (goldRush ? 1.25 : 1);
    let hx, hy;
    if (e === 0){ hx = -30; hy = rand(0,H); }
    else if (e === 1){ hx = W+30; hy = rand(0,H); }
    else if (e === 2){ hx = rand(0,W); hy = -30; }
    else { hx = rand(0,W); hy = H+30; }
    if (Math.hypot(hx - p.x, hy - p.y) > 220){   // never spawn right on topRuns of you
      const a = Math.atan2(p.y - hy + rand(-60,60), p.x - hx + rand(-60,60));
      warns.push({x:Math.min(W-14, Math.max(14, hx)), y:Math.min(H-14, Math.max(14, hy)),
                  sx:hx, sy:hy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(11,20), t:.75, elite: t > 45 && Math.random() < .08, chase: t > 15 && Math.random() < .25, zig: t > 8 && Math.random() < .2, ph: rand(0, 6.28), split: t > 12 && Math.random() < .15});
    }
  }

  // warnings turn into real enemies after a short countdown
  for (const w of warns){ w.t -= dt; if (w.t <= 0) haz.push({x:w.sx, y:w.sy, vx:w.vx*(w.elite ? 1.3 : 1), vy:w.vy*(w.elite ? 1.3 : 1), r:w.r, elite:w.elite, chase:w.chase, zig:w.zig, ph:w.ph, split:w.split, life:8}); }
  warns = warns.filter(w => w.t > 0);

  // hazards
  for (const h of haz){
    if (h.chase){   // purple enemies slowly curve toward you, then vanish after 8 seconds
      const a = Math.atan2(p.y - h.y, p.x - h.x);
      h.vx += Math.cos(a)*240*dt; h.vy += Math.sin(a)*240*dt;
      const sp = Math.hypot(h.vx, h.vy);
      if (sp > 190){ h.vx *= 190/sp; h.vy *= 190/sp; }
      h.life -= dt;
      if (h.life <= 0) h.x = -999;
    }
    const fz = frozen > 0 ? 0 : 1;   // freeze orb stops every enemy
    h.x += h.vx*dt*fz; h.y += h.vy*dt*fz;
    h.age = (h.age || 0) + dt;
    if (h.split && h.age > 1.6 && h.r > 9){   // splitters break into two smaller enemies
      const sa = Math.atan2(h.vy, h.vx), ss = Math.hypot(h.vx, h.vy);
      for (const d of [-.7, .7]) haz.push({x:h.x, y:h.y, vx:Math.cos(sa + d)*ss, vy:Math.sin(sa + d)*ss, r:h.r*.65});
      burst(h.x, h.y, '#fff', 12); h.x = -999;
    }
    if (h.zig && !h.chase){   // zigzag enemies wobble side to side
      const zs = Math.hypot(h.vx, h.vy) || 1, wob = Math.sin(t*6 + h.ph) * 140 * dt * fz;
      h.x += -h.vy/zs * wob; h.y += h.vx/zs * wob;
    }
    const d = Math.hypot(h.x-p.x, h.y-p.y);
    if (dashT > 0 && d < h.r + p.r + 6){   // dashing smashes enemies
      const sg = (h.giant ? 500 : h.elite ? 300 : 40) * combo;
      score += sg; comboT = cTime();
      pop(h.x, h.y, (h.giant ? 'GIANT SMASHED! +' : 'SMASH! +') + sg, '#fff');
      smashN++; smashTot++;
      if (smashN === 3){ score += 300*combo; pop(p.x, p.y - 50, 'TRIPLE SMASH! +' + 300*combo, '#fff'); shake = 20; }
      burst(h.x, h.y, '#fff', h.giant ? 70 : 25); beep(500, .1, 'square');
      shake = h.giant ? 30 : 10; if (h.giant) slow = .6;
      h.x = -999; h.vx = 0; h.vy = 0;
      continue;
    }
    if (d < h.r + p.r - 3){
      if (shield){
        shield = false; h.x = -999; h.y = -999; h.vx = 0; h.vy = 0;
        burst(p.x, p.y, '#6cf', 40); shake = 18; slow = .4; beep(200, .3, 'square');
        pop(p.x, p.y - 40, 'SHIELD SAVED YOU!', '#6cf');
        continue;
      }
      if (die()) return;
    }
    if (!h.near && d < h.r + p.r + 22){   // near miss = risky bonus
      h.near = true; nears++; nmC = nmT > 0 ? nmC + 1 : 1; nmT = 3;
      const nb = 25 * combo * nmC; score += nb; comboT = cTime();
      pop(p.x, p.y - 30, 'CLOSE x' + nmC + '! +' + nb, '#ff9ff3'); beep(900, .1, 'square');
    }
  }
  haz = haz.filter(h => h.x > -80 && h.x < W+80 && h.y > -80 && h.y < H+80);

  // orbs
  for (const o of orbs){
    o.life -= dt;
    if (Math.hypot(p.x - o.x, p.y - o.y) < (bigMag ? 220 : 100) + up.mag*20){ o.x += (p.x - o.x) * dt * 5; o.y += (p.y - o.y) * dt * 5; }   // magnet
    const pp = petPos();
    if (Math.hypot(o.x-p.x, o.y-p.y) < o.r + p.r + 2 || (level(xp) >= 3 && Math.hypot(o.x-pp.x, o.y-pp.y) < o.r + 12)){
      o.life = 0; o.got = true;
      perfect++;
      if (perfect % 5 === 0){ score += 100*combo; pop(o.x, o.y - 50, 'PERFECT x' + perfect + '! +' + 100*combo, '#fff'); }
      const gain = (o.jp ? 50 : 10) * combo * (combo === 10 ? 2 : 1) * (goldRush ? 2 : 1) * (dblT > 0 ? 2 : 1) * (o.risk ? 3 : 1) * (1 + up.score*.1) | 0;
      score += gain;
      pop(o.x, o.y, (o.jp ? 'JACKPOT +' : '+') + gain, o.jp ? '#ff9ff3' : '#ffd34d');
      if (t - o.born < .7){ const qb = gain >> 1; score += qb; pop(o.x, o.y + 22, 'QUICK! +' + qb, '#fff'); }
      if (o.gm){ coins += 20; save(); pop(o.x, o.y - 30, '+20 COINS', '#c77dff'); beep(1500, .12, 'triangle'); }
      if (o.dc){ dashCd = 0; pop(o.x, o.y - 30, 'DASH READY!', '#55efc4'); beep(1100, .15, 'triangle'); }
      if (o.dp){ dblT = 8; pop(o.x, o.y - 30, '2x POINTS!', '#ffa'); beep(880, .2, 'triangle'); }
      if (o.fr){ frozen = 4; pop(o.x, o.y - 30, 'FREEZE!', '#bff'); sweep(1200, 300, .4, 'triangle', .12); }
      if (o.sh){ shield = true; pop(o.x, o.y - 30, 'SHIELD!', '#6cf'); beep(500, .2, 'triangle'); }
      if (o.jp){ jps++; buzz(40); burst(o.x, o.y, '#ff9ff3', 30); beep(1320, .3, 'triangle'); shake = 8; }
      combo = Math.min(10, combo + 1);
      comboT = cTime();
      collected++;
      burst(o.x, o.y, '#ffd34d', 14);
      shepard(chain++);
      if (collected % 15 === 0){            // POWER PULSE: wipes every hazard
        rings.push({r:0, a:1});
        pulses++; pulseSfx(); slow = .25; pop(p.x, p.y - 50, 'PULSE!', '#6cf');
        for (const h of haz) if (!h.giant && Math.hypot(h.x - p.x, h.y - p.y) <= 260) burst(h.x, h.y, '#fff', 12);
        haz = haz.filter(h => h.giant || Math.hypot(h.x - p.x, h.y - p.y) > 260);
        score += 50 * combo;
        shake = 26;
      }
    }
  }
  for (const o of orbs) if (o.life <= 0 && !o.got) perfect = 0;   // a missed orb breaks your perfect streak
  orbs = orbs.filter(o => o.life > 0);

  if (!beat && best > 0 && score > best){
    beat = true; pop(p.x, p.y - 60, 'NEW BEST!', '#fff'); beep(1046, .3, 'triangle'); shake = 10;
  }

  // achievements: each one unlocks once, forever
  for (let i = 0; i < achs.length; i++){
    if (!ach.includes(i) && achs[i].ok()){
      ach.push(i); coins += 50; save();
      try { localStorage.setItem('orbrush-ach', ach.join(',')); } catch(e) {}
      banner = 'ACHIEVEMENT: ' + achs[i].n + ' +50 coins'; bannerT = 2.5; beep(988, .2, 'triangle');
    }
  }

  // announcer: hype banner every 500 points
  if (score >= nextMile){
    const hype = ['NICE!', 'GREAT!', 'UNSTOPPABLE!', 'GODLIKE!', 'LEGENDARY!'];
    banner = hype[Math.min(4, nextMile/500 - 1)]; bannerT = 1.5; nextMile += 500; beep(1046, .2, 'triangle');
  }

  // goal check: one goal can be finished per run, it pays bonus XP
  maxCombo = Math.max(maxCombo, combo);
  if (!goalDone && goals[goalIdx % goals.length].ok()){
    goalDone = true; xpBonus += 200; goalIdx++; coins += 100; save();
    try { localStorage.setItem('orbrush-goal', goalIdx); } catch(e) {}
    pop(W/2, 150, 'GOAL COMPLETE! +200 XP +100 coins', '#55efc4'); beep(880, .15, 'triangle');
    setTimeout(() => beep(1320, .25, 'triangle'), 120);
  }



  // wave counter: every 30 seconds a new wave starts with a breather of free orbs
  const wv = Math.floor(t/30) + 1;
  if (wv > wave){
    wave = wv;
    if (wave > 1){
      banner = 'WAVE ' + wave; bannerT = 2; score += 100*wave; coins += 10; beep(784, .2, 'triangle');
      for (let i = 0; i < 5; i++) orbs.push({x:rand(40, W-40), y:rand(70, H-40), r:10, life:3.5});
    }
  }

  // soft melody that joins in when your combo is 4+ (higher notes at combo 8+)
  musT -= dt;
  if (combo >= 4 && musT <= 0){
    musT = .22;
    const scale = [0, 2, 4, 7, 9];
    beep(262 * Math.pow(2, (scale[Math.floor(rand(0, 5))] + (combo >= 8 ? 12 : 0))/12), .2, 'triangle', .035);
  }

  // laser beam every ~14 seconds: red warning line, then a beam. Dash through it to survive!
  lsT -= dt;
  if (lsT <= 0 && lasers.length === 0){
    lsT = 18;
    const v = Math.random() < .5;
    lasers.push({v, pos: v ? Math.min(W-30, Math.max(30, p.x + rand(-150, 150))) : Math.min(H-30, Math.max(30, p.y + rand(-150, 150))), t:1.3, on:.5, hit:false});
    banner = 'LASER!'; bannerT = 1.3; beep(300, .3, 'square');
  }
  for (const l of lasers){
    l.t -= dt;
    if (l.t > 0) continue;
    l.on -= dt;
    const dl = l.v ? Math.abs(p.x - l.pos) : Math.abs(p.y - l.pos);
    if (dashT > 0 && dl < p.r + 8 && !l.dodged){ l.dodged = true; score += 150*combo; pop(p.x, p.y - 40, 'LASER DODGE! +' + 150*combo, '#fff'); }
    if (!l.hit && dashT <= 0 && dl < p.r + 8){
      if (shield){ shield = false; l.hit = true; shake = 18; pop(p.x, p.y - 40, 'SHIELD SAVED YOU!', '#6cf'); }
      else { if (die()) return; }
    }
  }
  lasers = lasers.filter(l => l.on > 0);

  // surprise event every ~22 seconds: orb rain or enemy swarm
  evT -= dt;
  if (evT <= 0){
    evT = 25; bannerT = 2;
    const ev = Math.random();
    if (ev < .25){
      banner = 'ORB RAIN!'; beep(660, .2, 'triangle');
      for (let i = 0; i < 10; i++) orbs.push({x:rand(40, W-40), y:rand(70, H-40), r:10, life:6});
    } else if (ev < .45){
      banner = 'SWARM INCOMING!'; swarm = 7; beep(200, .4, 'sawtooth');
    } else if (ev < .6){
      banner = 'GIANT! DASH THROUGH IT!'; beep(80, .6, 'sawtooth'); shake = 12;
      const gdir = Math.random() < .5 ? 1 : -1;
      haz.push({x: gdir > 0 ? -70 : W + 70, y: rand(H*.25, H*.75), vx: gdir*90, vy: 0, r: 48, giant: true});
    } else if (ev < .72){
      banner = 'CROSSFIRE!'; beep(250, .4, 'sawtooth'); shake = 8;
      for (let i = 0; i < 2; i++){ warnAt(rand(0, W), -20); warnAt(rand(0, W), H + 20); warnAt(-20, rand(0, H)); warnAt(W + 20, rand(0, H)); }
    } else if (ev < .86){
      banner = 'GOLD RUSH! 2x ORBS'; goldRush = true; goldT = 12; beep(1200, .2, 'triangle');
    } else {
      banner = 'MAGNET RUN!'; bigMag = true; magT = 12; beep(700, .2, 'triangle');
    }
  }
  if (swarm > 0) swarm -= dt;
  if (frozen > 0) frozen -= dt;
  if (goldT > 0){ goldT -= dt; if (goldT <= 0) goldRush = false; }
  if (magT > 0){ magT -= dt; if (magT <= 0) bigMag = false; }
  if (dblT > 0) dblT -= dt;
  if (bannerT > 0) bannerT -= dt;

  // combo runs out if you stop collecting
  if (comboT > 0){ comboT -= dt; if (comboT <= 0){ if (combo >= 5) pop(W/2, 130, 'COMBO LOST!', '#ff9aa8'); combo = 1; chain = 0; } }
}

// ---- Draw ----
function text(s, px, py, size, col, align){
  x.font = 'bold ' + size + 'px system-ui,sans-serif';
  x.textAlign = align || 'center'; x.fillStyle = col || '#fff';
  x.fillText(s, px, py);
}

function warnAt(hx, hy){   // queue an enemy with a warning mark (used by special events)
  const a = Math.atan2(p.y - hy + rand(-60, 60), p.x - hx + rand(-60, 60)), sp = 110 + 190*(1 - Math.exp(-t/60));
  warns.push({x:Math.min(W-14, Math.max(14, hx)), y:Math.min(H-14, Math.max(14, hy)), sx:hx, sy:hy,
              vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(11, 20), t:.9});
}

// Enemies are SPIKY and RED with a dark center. Orbs are always smooth circles.
function drawEnemy(h, col){
  const spikes = h.split ? 5 : 8;
  x.save(); x.translate(h.x, h.y); x.rotate(performance.now()/400);
  x.shadowColor = col; x.shadowBlur = 18; x.fillStyle = col;
  x.beginPath();
  for (let i = 0; i < spikes*2; i++){
    const a = i*Math.PI/spikes, rr = i % 2 ? h.r*.7 : h.r*1.15;
    x.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  x.closePath(); x.fill(); x.shadowBlur = 0;
  x.fillStyle = '#300'; x.beginPath(); x.arc(0, 0, h.r*.4, 0, 6.283); x.fill();
  if (h.elite){ x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, h.r*1.5, 0, 6.283); x.stroke(); }
  x.restore();
}

function glowCircle(px, py, r, col){
  x.shadowColor = col; x.shadowBlur = 20; x.fillStyle = col;
  x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  x.shadowBlur = 0;
}

function draw(){
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle = 'hsla(' + ((240 + level(xp)*25 + new Date().getMonth()*30) % 360) + ',60%,5%,.3)'; x.fillRect(0,0,W,H);
  x.translate(rand(-shake,shake), rand(-shake,shake));

  for (const s of stars){   // star field: drifts faster as your combo grows
    s.x -= s.s * (.3 + combo*.15) * (state === 'play' ? 1 : .3);
    if (s.x < 0) s.x += 2000;
    x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(s.x % W, s.y % H, s.s, s.s);
  }
  if (state === 'play' && combo === 10){   // fever: rainbow screen flash
    x.fillStyle = 'hsla(' + (performance.now()/6 % 360) + ',100%,50%,.07)'; x.fillRect(-20, -20, W + 40, H + 40);
  }

  for (const r of rings){
    x.strokeStyle = 'rgba(255,255,255,' + r.a + ')'; x.lineWidth = 6;
    x.beginPath(); x.arc(p.x, p.y, r.r, 0, 6.283); x.stroke();
  }
  if (state !== 'menu' && state !== 'shop'){
    for (const o of orbs){
      const pulse = 1 + Math.sin(performance.now()/120)*.18;
      glowCircle(o.x, o.y, o.r*pulse, o.life < 1.2 && Math.floor(o.life*8)%2 ? '#fff' : (o.jp ? '#ff9ff3' : o.gm ? '#c77dff' : o.dc ? '#55efc4' : o.dp ? '#ffa' : o.fr ? '#bff' : o.sh ? '#6cf' : '#ffd34d'));
      if (o.risk){ x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(o.x, o.y, o.r*pulse + 7, 0, 6.283); x.stroke(); }
    }
    for (const w of warns){
      x.globalAlpha = .4 + .6*Math.abs(Math.sin(w.t*14));
      text('!', w.x, w.y + 9, 28, '#ff4d6d');
    }
    x.globalAlpha = 1;
    for (const l of lasers){   // laser: thin flashing warning, then a thick red beam
      if (l.t > 0){ x.strokeStyle = 'rgba(255,77,109,' + (.3 + .4*Math.abs(Math.sin(l.t*16))) + ')'; x.lineWidth = 2; }
      else { x.strokeStyle = '#ff4d6d'; x.lineWidth = 16; x.shadowColor = '#ff4d6d'; x.shadowBlur = 25; }
      x.beginPath();
      if (l.v){ x.moveTo(l.pos, 0); x.lineTo(l.pos, H); } else { x.moveTo(0, l.pos); x.lineTo(W, l.pos); }
      x.stroke(); x.shadowBlur = 0;
    }
    for (const h of haz) drawEnemy(h, frozen > 0 ? '#a33' : '#ff4d6d');
    for (const q of parts){ x.globalAlpha = Math.max(0, q.life); glowCircle(q.x, q.y, 3, q.col); }
    x.globalAlpha = 1;
    for (const f of pops){ x.globalAlpha = Math.max(0, f.life); text(f.s, f.x, f.y - (1 - f.life)*40, 22, f.col); }
    x.globalAlpha = 1;
    if (state === 'play'){
      const fever = combo === 10;
      if (level(xp) >= 3){ const pp = petPos(); glowCircle(pp.x, pp.y, 6, myColor()); }
      if (dashT > 0){
        x.strokeStyle = '#fff'; x.lineWidth = 4;
        x.beginPath(); x.arc(p.x, p.y, p.r + 16, 0, 6.283); x.stroke();
      }
      glowCircle(p.x, p.y, p.r + (fever ? 4 : 0), fever ? 'hsl(' + (performance.now()/4 % 360) + ',100%,65%)' : myColor());
      if (shield){
        x.strokeStyle = '#6cf'; x.lineWidth = 3;
        x.beginPath(); x.arc(p.x, p.y, p.r + 10, 0, 6.283); x.stroke();
      }
    }
  }

  x.setTransform(1,0,0,1,0,0);
  text('v15', W - 10, H - 10, 12, '#555', 'right');
  if (state === 'play'){
    text(Math.floor(score), W/2, 60, 44);
    text(combo === 10 ? 'FEVER! DOUBLE POINTS' : 'x' + combo + (combo >= 8 ? ' BLAZING' : combo >= 5 ? ' HOT' : ''), W/2, 95, 24, combo > 1 ? '#ffd34d' : '#888');
    text('BEST ' + best + '   LVL ' + level(xp) + '   WAVE ' + wave, 16, 28, 16, '#667', 'left');
    text(goalDone ? 'GOAL COMPLETE!' : 'GOAL: ' + goals[goalIdx % goals.length].txt, 16, 50, 14, '#55efc4', 'left');
    if (bannerT > 0){
      x.globalAlpha = Math.min(1, bannerT);
      text(banner, W/2, H/2 - 80, 40, /SWARM|GIANT|LASER|CROSSFIRE/.test(banner) ? '#ff4d6d' : '#ffd34d');
      x.globalAlpha = 1;
    }
    x.fillStyle = '#ffd34d'; x.fillRect(W/2 - 60, 108, 120*Math.max(0, comboT)/cTime(), 5);
    x.fillStyle = '#223'; x.fillRect(W/2 - 100, H - 26, 200, 6);
    x.fillStyle = dashCd <= 0 ? '#fff' : '#666'; x.fillRect(W/2 - 100, H - 26, 200 * (1 - Math.max(0, dashCd)/dashMax()), 6);
    text(dashCd <= 0 ? 'DASH READY: tap / click / Space' : 'dash recharging...', W/2, H - 10, 13, dashCd <= 0 ? '#fff' : '#667');
    const ch = collected % 15;
    x.fillStyle = '#223'; x.fillRect(W/2 - 100, H - 40, 200, 10);
    x.fillStyle = '#6cf'; x.fillRect(W/2 - 100, H - 40, 200*ch/15, 10);
    text(ch === 14 ? 'ONE MORE ORB = PULSE BLAST!' : 'PULSE CHARGE: 15 orbs = blast nearby enemies', W/2, H - 48, 14, ch === 14 ? '#6cf' : '#8a8aa8');
  } else if (state === 'shop'){
    drawShop();
  } else if (state === 'menu'){
    text('ORB RUSH', W/2, H/2 - 40, 64, '#6cf');
    text('Collect the round glowing orbs. Dodge anything SPIKY and RED!', W/2, H/2 + 5, 20, '#aab');
    text('Tap/Space to start, then to DASH and smash enemies!', W/2, H/2 + 35, 18, '#889');
    if (best) text('Best: ' + best, W/2, H/2 + 130, 22, '#ffd34d');
    if (topRuns.length){ text('TOP RUNS', W/2, 36, 14, '#889'); topRuns.forEach((v, i) => text('#' + (i + 1) + '  ' + v, W/2, 56 + i*18, 14, i === 0 ? '#ffd34d' : '#aab')); }
    drawBtn();
  } else {
    text('GAME OVER', W/2, H/2 - 50, 56, '#ff4d6d');
    text('Score ' + Math.floor(shownScore), W/2, H/2 + 5, 34);
    text(Math.floor(score) >= best && score > 0 ? 'NEW BEST!' : 'So close! Only ' + (best - Math.floor(score)) + ' short of your best', W/2, H/2 + 45, 24, '#ffd34d');
    text('Tap or press Space to go again  (C = copy score)', W/2, H/2 + 90, 18, '#889');
    text('+' + gained + ' XP' + (lucky > 1 ? ' LUCKY x' + lucky + '!' : '') + (leveled ? '   LEVEL UP!' + (level(xp) === 3 ? ' PET UNLOCKED! +100 coins' : ' +100 coins') : ''), W/2, H/2 + 125, 18, leveled ? '#55efc4' : '#8a8aa8');
    xpBar(H/2 + 138);
    text('NEXT GOAL: ' + goals[goalIdx % goals.length].txt, W/2, H/2 + 195, 16, '#55efc4');
    text('+' + coinsGot + ' coins  (total ' + coins + ')   best combo x' + maxCombo, W/2, H/2 + 220, 16, '#ffd34d');
    drawBtn();
    text('LVL ' + level(xp) + ' ' + rank() + '   Run #' + runs + (rankPos ? '. Top 5: #' + rankPos + '!' : '. The next one is the one!'), W/2, H/2 + 170, 16, '#667');
  }
}

function loop(ts){
  let dt = Math.min((ts - last)/1000, .05); last = ts;
  c.style.cursor = state === 'play' ? 'none' : 'default';
  if (slow > 0){ slow -= dt; dt *= .25; }   // slow-motion after a pulse
  update(dt); draw();
  requestAnimationFrame(loop);
}
p = {x:W/2, y:H/2, r:12}; orbs = []; haz = []; parts = []; rings = [];
score = 0; combo = 1; comboT = 0; collected = 0; shake = 0;
requestAnimationFrame(loop);
</script>
</body>
