<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orb Rush</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- Input (mouse, touch, keyboard) ----
let mx = W/2, my = H/2;
function move(e){ const t = e.touches ? e.touches[0] : e; mx = t.clientX; my = t.clientY; }
addEventListener('mousemove', move);
addEventListener('touchmove', e => { e.preventDefault(); move(e); }, {passive:false});
addEventListener('touchstart', e => { move(e); press(); });
addEventListener('mousedown', press);
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'Enter') press(); });

// ---- Game state ----
let state = 'menu', overAt = 0, last = 0, runs = 0, slow = 0, beat = false;
let p, orbs, haz, parts, rings, warns = [];
let score, combo, comboT, t, spawnO, spawnH, collected, shake, best = 0;
try { best = +localStorage.getItem('orbrush-best') || 0; runs = +localStorage.getItem('orbrush-runs') || 0; } catch(e) {}

const rand = (a,b) => a + Math.random()*(b-a);

// ---- Sound beeps and floating score text ----
let ac, pops = [];
function beep(f, d, type){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.value = .08; g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch(e) {}
}
function pop(px, py, s, col){ pops.push({x:px, y:py, s, col, life:1}); }

// a beep that slides from one pitch to another (used to build big sounds)
function sweep(f1, f2, d, type, vol){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + d);
    g.gain.setValueAtTime(vol || .12, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d);
  } catch(e) {}
}
// deep boom + rising whoosh + sparkly notes = satisfying blast
function pulseSfx(){
  sweep(180, 30, .6, 'sine', .3);
  sweep(200, 1400, .3, 'sawtooth', .08);
  [784, 988, 1175, 1568, 1976].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle'), 120 + i*60));
}

function press(){
  if (state === 'play') return;
  if (state === 'over' && performance.now() - overAt < 600) return;
  start();
}

function start(){
  pops = []; warns = []; beat = false;
  p = {x:mx, y:my, r:12};
  orbs = []; haz = []; parts = []; rings = [];
  score = 0; combo = 1; comboT = 0; t = 0; spawnO = 0; spawnH = 1; collected = 0; shake = 0;
  state = 'play';
}

function burst(px, py, col, n){
  for (let i = 0; i < n; i++){
    const a = rand(0, 6.283), s = rand(60, 300);
    parts.push({x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(.4,.9), col});
  }
}

function die(){
  state = 'over'; overAt = performance.now(); shake = 22;
  beep(90, .5, 'sawtooth');
  runs++;
  try { localStorage.setItem('orbrush-runs', runs); } catch(e) {}
  burst(p.x, p.y, '#fff', 60);
  if (score > best){
    best = Math.floor(score);
    try { localStorage.setItem('orbrush-best', best); } catch(e) {}
  }
}

// ---- Update ----
function update(dt){
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .98; q.vy *= .98; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const r of rings){ r.r += 900*dt; r.a -= dt*1.6; }
  rings = rings.filter(r => r.a > 0);
  for (const f of pops) f.life -= dt*1.2;
  pops = pops.filter(f => f.life > 0);
  shake *= .9;
  if (state !== 'play') return;

  t += dt;
  p.x += (mx - p.x) * Math.min(1, dt*14);
  p.y += (my - p.y) * Math.min(1, dt*14);

  // spawn orbs
  spawnO -= dt;
  if (spawnO <= 0 && orbs.length < 5){
    spawnO = .8;
    const jp = Math.random() < .12;   // rare pink jackpot orb
    orbs.push({x:rand(40, W-40), y:rand(70, H-40), r:jp ? 15 : 10, life:jp ? 3 : 4, jp});
  }

  // spawn hazards (faster and faster)
  spawnH -= dt;
  if (spawnH <= 0){
    spawnH = Math.max(.3, 1.3 - t*.02);
    const e = Math.floor(rand(0,4)), sp = Math.min(280, 90 + t*2.5);
    let hx, hy;
    if (e === 0){ hx = -30; hy = rand(0,H); }
    else if (e === 1){ hx = W+30; hy = rand(0,H); }
    else if (e === 2){ hx = rand(0,W); hy = -30; }
    else { hx = rand(0,W); hy = H+30; }
    if (Math.hypot(hx - p.x, hy - p.y) > 220){   // never spawn right on top of you
      const a = Math.atan2(p.y - hy + rand(-150,150), p.x - hx + rand(-150,150));
      warns.push({x:Math.min(W-14, Math.max(14, hx)), y:Math.min(H-14, Math.max(14, hy)),
                  sx:hx, sy:hy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(11,20), t:.9});
    }
  }

  // warnings turn into real enemies after a short countdown
  for (const w of warns){ w.t -= dt; if (w.t <= 0) haz.push({x:w.sx, y:w.sy, vx:w.vx, vy:w.vy, r:w.r}); }
  warns = warns.filter(w => w.t > 0);

  // hazards
  for (const h of haz){
    h.x += h.vx*dt; h.y += h.vy*dt;
    const d = Math.hypot(h.x-p.x, h.y-p.y);
    if (d < h.r + p.r - 6){ die(); return; }
    if (!h.near && d < h.r + p.r + 22){   // near miss = risky bonus
      h.near = true; score += 25 * combo; comboT = 3;
      pop(p.x, p.y - 30, 'CLOSE! +' + 25*combo, '#ff9ff3'); beep(900, .1, 'square');
    }
  }
  haz = haz.filter(h => h.x > -80 && h.x < W+80 && h.y > -80 && h.y < H+80);

  // orbs
  for (const o of orbs){
    o.life -= dt;
    if (Math.hypot(p.x - o.x, p.y - o.y) < 130){ o.x += (p.x - o.x) * dt * 5; o.y += (p.y - o.y) * dt * 5; }   // magnet
    if (Math.hypot(o.x-p.x, o.y-p.y) < o.r + p.r + 6){
      o.life = 0;
      const gain = (o.jp ? 50 : 10) * combo * (combo === 10 ? 2 : 1);
      score += gain;
      pop(o.x, o.y, (o.jp ? 'JACKPOT +' : '+') + gain, o.jp ? '#ff9ff3' : '#ffd34d');
      if (o.jp){ burst(o.x, o.y, '#ff9ff3', 30); beep(1320, .3, 'triangle'); shake = 8; }
      combo = Math.min(10, combo + 1);
      comboT = 3;
      collected++;
      burst(o.x, o.y, '#ffd34d', 14);
      beep(300 + combo*60, .12);
      if (collected % 8 === 0){            // POWER PULSE: wipes every hazard
        rings.push({r:0, a:1});
        pulseSfx(); slow = .5; pop(p.x, p.y - 50, 'PULSE!', '#6cf');
        for (const h of haz) burst(h.x, h.y, '#ff4d6d', 12);
        haz = [];
        score += 50 * combo;
        shake = 26;
      }
    }
  }
  orbs = orbs.filter(o => o.life > 0);

  if (!beat && best > 0 && score > best){
    beat = true; pop(p.x, p.y - 60, 'NEW BEST!', '#fff'); beep(1046, .3, 'triangle'); shake = 10;
  }

  // combo runs out if you stop collecting
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 1; }
}

// ---- Draw ----
function text(s, px, py, size, col, align){
  x.font = 'bold ' + size + 'px system-ui,sans-serif';
  x.textAlign = align || 'center'; x.fillStyle = col || '#fff';
  x.fillText(s, px, py);
}

function glowCircle(px, py, r, col){
  x.shadowColor = col; x.shadowBlur = 20; x.fillStyle = col;
  x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  x.shadowBlur = 0;
}

function draw(){
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle = 'rgba(7,7,15,.3)'; x.fillRect(0,0,W,H);
  x.translate(rand(-shake,shake), rand(-shake,shake));

  for (const r of rings){
    x.strokeStyle = 'rgba(255,255,255,' + r.a + ')'; x.lineWidth = 6;
    x.beginPath(); x.arc(p.x, p.y, r.r, 0, 6.283); x.stroke();
  }
  if (state !== 'menu'){
    for (const o of orbs){
      const pulse = 1 + Math.sin(performance.now()/120)*.18;
      glowCircle(o.x, o.y, o.r*pulse, o.life < 1.2 && Math.floor(o.life*8)%2 ? '#fff' : (o.jp ? '#ff9ff3' : '#ffd34d'));
    }
    for (const w of warns){
      x.globalAlpha = .4 + .6*Math.abs(Math.sin(w.t*14));
      text('!', w.x, w.y + 9, 28, '#ff4d6d');
    }
    x.globalAlpha = 1;
    for (const h of haz) glowCircle(h.x, h.y, h.r, '#ff4d6d');
    for (const q of parts){ x.globalAlpha = Math.max(0, q.life); glowCircle(q.x, q.y, 3, q.col); }
    x.globalAlpha = 1;
    for (const f of pops){ x.globalAlpha = Math.max(0, f.life); text(f.s, f.x, f.y - (1 - f.life)*40, 22, f.col); }
    x.globalAlpha = 1;
    if (state === 'play'){
      const fever = combo === 10;
      glowCircle(p.x, p.y, p.r + (fever ? 4 : 0), fever ? 'hsl(' + (performance.now()/4 % 360) + ',100%,65%)' : 'hsl(' + (180 + combo*18) + ',100%,65%)');
    }
  }

  x.setTransform(1,0,0,1,0,0);
  text('v4', W - 10, H - 10, 12, '#555', 'right');
  if (state === 'play'){
    text(Math.floor(score), W/2, 60, 44);
    text(combo === 10 ? 'FEVER! DOUBLE POINTS' : 'x' + combo, W/2, 95, 24, combo > 1 ? '#ffd34d' : '#888');
    text('BEST ' + best, 16, 28, 16, '#667', 'left');
    x.fillStyle = '#ffd34d'; x.fillRect(W/2 - 60, 108, 120*Math.max(0, comboT)/3, 5);
    const ch = collected % 8;
    x.fillStyle = '#223'; x.fillRect(W/2 - 100, H - 40, 200, 10);
    x.fillStyle = '#6cf'; x.fillRect(W/2 - 100, H - 40, 200*ch/8, 10);
    text(ch === 7 ? 'ONE MORE ORB = PULSE BLAST!' : 'PULSE CHARGE: at 8 orbs, every red orb explodes', W/2, H - 48, 14, ch === 7 ? '#6cf' : '#8a8aa8');
  } else if (state === 'menu'){
    text('ORB RUSH', W/2, H/2 - 40, 64, '#6cf');
    text('Move to collect gold orbs. Dodge the red ones.', W/2, H/2 + 5, 20, '#aab');
    text('Chain orbs for bigger combos. Tap or press Space to start.', W/2, H/2 + 35, 18, '#889');
    text('Every 8 orbs = PULSE: a blast that wipes out all red orbs!', W/2, H/2 + 65, 18, '#6cf');
    text('Watch for the red "!" marks: enemies appear there.', W/2, H/2 + 92, 16, '#ff4d6d');
    if (best) text('Best: ' + best, W/2, H/2 + 130, 22, '#ffd34d');
  } else {
    text('GAME OVER', W/2, H/2 - 50, 56, '#ff4d6d');
    text('Score ' + Math.floor(score), W/2, H/2 + 5, 34);
    text(Math.floor(score) >= best && score > 0 ? 'NEW BEST!' : 'So close! Only ' + (best - Math.floor(score)) + ' short of your best', W/2, H/2 + 45, 24, '#ffd34d');
    text('Tap or press Space to go again', W/2, H/2 + 90, 18, '#889');
    text('Run #' + runs + '. The next one is the one!', W/2, H/2 + 120, 16, '#667');
  }
}

function loop(ts){
  let dt = Math.min((ts - last)/1000, .05); last = ts;
  if (slow > 0){ slow -= dt; dt *= .25; }   // slow-motion after a pulse
  update(dt); draw();
  requestAnimationFrame(loop);
}
p = {x:W/2, y:H/2, r:12}; orbs = []; haz = []; parts = []; rings = [];
score = 0; combo = 1; comboT = 0; collected = 0; shake = 0;
requestAnimationFrame(loop);
</script>
</body>
</html>
